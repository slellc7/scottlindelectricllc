<!-- Emergency banner. In the design this was a togglable prop (default on).
     To retire it, delete this <div class="topbar"> block. -->
<div class="topbar">
  <div class="topbar-inner">
    <span class="topbar-lead"><span class="topbar-dot" aria-hidden="true"></span>After-hours electrical emergency? We answer the phone.</span>
    <span class="topbar-note">Idaho Falls &amp; Ammon · No service-call fee within 30 miles</span>
    <a class="topbar-tel" href="{{site.telHref}}">{{site.phone}}</a>
  </div>
</div>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/">
      <img src="/images/sle-logo.png" alt="{{site.legalName}} — home" width="275" height="75">
    </a>

    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-nav" aria-expanded="false" hidden>
      <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span>
      Menu
    </button>

    <nav class="nav-main" id="site-nav" aria-label="Main">
        {{nav}}
    </nav>

    <a href="{{site.telHref}}" class="btn btn-primary blueprint header-cta">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      Call {{site.phone}}
    </a>
  </div>
</header>
